[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tls-audit"
version = "0.1.0"
description = "Audit a host's TLS configuration, certificate, and post-quantum readiness."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "cryptography>=41",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.scripts]
tls-audit = "tls_audit.cli:main"

[project.urls]
Homepage = "https://github.com/barry-oc/tls-audit"
Issues = "https://github.com/barry-oc/tls-audit/issues"

[tool.setuptools.packages.find]
include = ["tls_audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
